dataset:
  repo_id: local/press_three_buttons_keyframes_v4
  root: /data/loop/yhz/datasets/lerobot_keyframes_v4_xyzrpy_gripper_500
  episode_start_only: true
  video_backend: pyav

policy:
  type: act
  n_obs_steps: 1
  input_features:
    observation.images.cam_head:
      type: VISUAL
      shape: [3, 480, 640]
  output_features:
    action:
      type: ACTION
      shape: [7]
  chunk_size: 10
  n_action_steps: 10
  action_delta_start_index: 1
  device: cuda
  push_to_hub: false
  optimizer_lr: 1.0e-5
  optimizer_lr_backbone: 1.0e-5

batch_size: 16
num_workers: 4
prefetch_factor: 4
persistent_workers: true
steps: 30000
log_freq: 200
save_freq: 5000
eval_steps: 0
output_dir: outputs/train/act_press_three_buttons_v4_first_frame_openloop10_30k
job_name: act_press_three_buttons_v4_first_frame_openloop10_30k
save_checkpoint: true
save_checkpoint_to_hub: false
seed: 1000

trackio:
  enable: false
