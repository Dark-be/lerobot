dataset:
  repo_id: local/turn_on_light_switch_lerobot_v3_300_keyframe
  root: /data/loop/yhz/datasets/turn_on_light_switch_lerobot_v3_300_keyframe
  episode_start_only: true
  video_backend: pyav

policy:
  type: akt
  n_obs_steps: 1
  input_features:
    observation.images.cam_head:
      type: VISUAL
      shape: [3, 480, 640]
  output_features:
    action:
      type: ACTION
      shape: [7]
  chunk_size: 4
  n_action_steps: 4
  device: cuda
  push_to_hub: false
  optimizer_lr: 1.0e-5
  optimizer_lr_backbone: 1.0e-5

batch_size: 16
num_workers: 4
prefetch_factor: 4
persistent_workers: true
steps: 30000
log_freq: 200
save_freq: 5000
eval_steps: 0
output_dir: outputs/train/akt_turn_on_light_switch_v3_first_frame_openloop4_30k
job_name: akt_turn_on_light_switch_v3_first_frame_openloop4_30k
save_checkpoint: true
save_checkpoint_to_hub: false
seed: 1000

trackio:
  enable: false
